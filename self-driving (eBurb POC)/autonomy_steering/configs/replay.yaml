model:
  export_path: "artifacts/exports/model_savedmodel/"

postprocess:
  deadband: 0.5
  saturation_min: -25.0
  saturation_max: 25.0
  rate_limit_deg_per_s: 200.0
  smooth_alpha: 0.2

timing:
  replay_fps: 30
  measure_latency: true

outputs:
  write_csv: true
  write_overlay_video: true
  ui_preview: true

bench_serial_stream:
  enabled: false
  requires_arm: true
